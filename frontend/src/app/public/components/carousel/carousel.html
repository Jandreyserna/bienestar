<ul
  #track
  class="track"
  tabindex="0"
  [attr.aria-label]="label() + ': usa las flechas del teclado para avanzar'"
  (scroll)="onScroll()"
  (keydown.arrowright)="$event.preventDefault(); next()"
  (keydown.arrowleft)="$event.preventDefault(); prev()"
>
  @for (slide of slides(); track slide.id; let i = $index) {
    <li
      class="slide"
      role="group"
      aria-roledescription="diapositiva"
      [attr.aria-label]="i + 1 + ' de ' + slides().length"
    >
      <figure class="media">
        @if (slide.imageUrl) {
          <img [src]="slide.imageUrl" [alt]="slide.title" loading="lazy" />
        } @else {
          <div class="placeholder" aria-hidden="true">
            @if (variant() === 'portrait') {
              {{ initials(slide.title) }}
            } @else {
              <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.4"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5Z" />
                <path d="M12 6.5v13" />
              </svg>
            }
          </div>
        }
      </figure>
      <div class="body">
        <h3>{{ slide.title }}</h3>
        @if (slide.description) {
          <p class="pre-line">{{ slide.description }}</p>
        }
      </div>
    </li>
  }
</ul>

@if (slides().length > 1) {
  <div class="controls">
    <button class="icon-btn" type="button" aria-label="Anterior" (click)="prev()">‹</button>
    <div class="dots">
      @for (slide of slides(); track slide.id; let i = $index) {
        <button
          type="button"
          class="dot"
          [class.active]="i === current()"
          [attr.aria-label]="'Ir a: ' + slide.title"
          [attr.aria-current]="i === current() ? 'true' : null"
          (click)="goTo(i)"
        ></button>
      }
    </div>
    <button class="icon-btn" type="button" aria-label="Siguiente" (click)="next()">›</button>
  </div>
}
