<a class="skip-link" href="#contenido">Saltar al contenido</a>

<header class="site-header">
  <div class="container bar">
    <a routerLink="/" class="brand" (click)="menuOpen.set(false)">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="32" height="32">
          <circle cx="16" cy="16" r="16" fill="currentColor" />
          <path d="M16 24c-5-3.2-8-6.2-8-9.6A4.4 4.4 0 0 1 16 12a4.4 4.4 0 0 1 8 2.4c0 3.4-3 6.4-8 9.6Z" fill="#fff" />
        </svg>
      </span>
      <span class="brand-name">Bienestar Moral</span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      aria-controls="site-nav"
      [attr.aria-expanded]="menuOpen()"
      (click)="menuOpen.update((open) => !open)"
    >
      <span class="sr-only">Abrir menú</span>
      <span aria-hidden="true">{{ menuOpen() ? '✕' : '☰' }}</span>
    </button>

    <nav id="site-nav" aria-label="Principal" [class.open]="menuOpen()">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="menuOpen.set(false)"
        >Inicio</a
      >
      <a routerLink="/valores-humanos" routerLinkActive="active" (click)="menuOpen.set(false)"
        >Valores humanos</a
      >
    </nav>
  </div>
</header>

<main id="contenido">
  <router-outlet />
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <div>
      <strong class="footer-brand">Bienestar Moral</strong>
      <p>Educación en valores humanos para el aula: recursos libres para docentes y familias.</p>
    </div>
    <nav aria-label="Pie de página" class="footer-nav">
      <a routerLink="/">Inicio</a>
      <a routerLink="/valores-humanos">Valores humanos</a>
      <a routerLink="/admin" class="admin-link">Administrar sitio</a>
    </nav>
  </div>
  <div class="container copy">© {{ year }} Bienestar Moral</div>
</footer>
