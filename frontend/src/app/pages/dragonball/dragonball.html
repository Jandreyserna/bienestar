<h1>estas en la pagina de Dragon Ball</h1>
<hr/>
<section class="row">
    <div class="col-12 col-sm-6">
        <h3>agregar: {{ name() }}</h3>
        <input 
            type="text" 
            placeholder="Nombre" 
            class="form-control"
            [value]="name()"
            (input)="name.set(txtName.value)"
            #txtName
        >
        <input 
            type="number"
            placeholder="Poder" 
            class="form-control mt-2"
            [value]="power()"
            (input)="power.set(numPower.valueAsNumber)"
            #numPower
         >
        <button class="btn btn-primary mt-2" (click)="addCharacter()">Agregar</button>
    </div>

    <div class="col-12 col-sm-6">
        <h3>Listado Fuertes</h3>
        <ul>
            @for(character of characters(); track character.id; let idx = $index) {
                @if(character.power > 500) {
                    <li>
                        <span>{{ idx + 1 }}. {{ character.name }}</span>
                        <strong [class.text-danger]="character.power > 9000"> ({{ character.power }})</strong>
                    </li>
                } @else {
                    <li>
                        <strong> no hay nadie </strong>
                    </li>
                }
            }
        </ul>
    </div>
</section>
